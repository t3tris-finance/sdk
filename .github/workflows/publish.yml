name: Publish

# Stages @t3tris/sdk on npmjs after a merge to main. Publication uses OIDC
# trusted publishing (no long-lived npm token) and the staged flow: each
# release waits in the staging area until a maintainer approves it with 2FA
# on npmjs.com (Staged Packages tab) or with `npm stage approve <stage-id>`.
#
# Requires a trusted publisher in the package settings on npmjs.com:
# GitHub Actions, org t3tris-finance, repository sdk, workflow publish.yml,
# action "npm stage publish". A version already published, or already staged
# and awaiting approval, is skipped so merges without a version bump stay
# green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage publish to npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Pack
        run: bun run smoke

      - name: Refuse a private or unlicensed package
        working-directory: .pack
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const errors = [];
          if (pkg.private !== false) {
            errors.push("staged package is private; set private: false in scripts/pack.ts");
          }
          if (typeof pkg.license !== "string" || pkg.license.length === 0) {
            errors.push("staged package has no license; add LICENSE and the license field");
          }
          if (!pkg.name || !pkg.version) {
            errors.push("staged package is missing name or version");
          }
          if (errors.length > 0) {
            for (const error of errors) console.error(error);
            process.exit(1);
          }
          EOF

      - name: npm CLI with staged publishing support
        run: |
          npm install --global npm@latest
          npm --version

      - name: Skip when the version is already published
        id: published
        working-directory: .pack
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@t3tris/sdk@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@t3tris/sdk@$version is already on npm, skipping."
          fi

      - name: Stage publish to npmjs
        if: steps.published.outputs.exists != 'true'
        working-directory: .pack
        # Staged versions are invisible to `npm view`, so a re-run while a
        # release awaits approval hits a duplicate-stage error: treat that
        # specific case as a no-op. Any other staging/publishing error fails.
        run: |
          if output=$(npm stage publish 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output"
          if echo "$output" | grep -qiE 'already (staged|exists)'; then
            echo "::notice::Version already staged on npm and awaiting approval."
            exit 0
          fi
          exit 1
