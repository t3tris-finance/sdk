name: Publish

# Automatically stages after merging a PR labeled exactly "publish" into main.
# Manual dispatch on main explicitly authorizes tagging and staging without a label.
# Other pushes do not build, tag or stage a release. Publication uses OIDC
# trusted publishing (no long-lived npm token) and the staged flow: each
# release waits in the staging area until a maintainer approves it with 2FA
# on npmjs.com (Staged Packages tab) or with `npm stage approve <stage-id>`.
# Build/test/smoke execute third-party code and run without credentials; only
# the publish job holds the OIDC permission, and it stages the artifact
# produced by the build job.
#
# Requires a trusted publisher in the package settings on npmjs.com:
# GitHub Actions, org t3tris-finance, repository sdk, workflow publish.yml,
# action "npm stage publish". A version already published, or already staged
# and awaiting approval, is skipped so merges without a version bump stay
# green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Require publish label or manual dispatch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.pr.outputs.publish }}
    steps:
      - uses: actions/github-script@v7
        id: pr
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("publish", "true");
              core.info("Manual dispatch on main authorizes tagging and staging.");
              return;
            }
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              per_page: 100,
            });
            const eligible = prs.some(pr =>
              pr.merged_at !== null &&
              pr.base.ref === "main" &&
              pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.merge_commit_sha === context.sha &&
              pr.labels.some(label => label.name === "publish")
            );
            core.setOutput("publish", String(eligible));
            core.info(eligible ? "Merged PR has publish label." : "No labeled merged PR for this commit; skipping staging.");

  build:
    name: Test / pack / smoke
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Pack
        run: bun run smoke

      - name: Refuse a private or unlicensed package
        working-directory: .pack
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const errors = [];
          if (pkg.private !== false) {
            errors.push("staged package is private; set private: false in scripts/pack.ts");
          }
          if (typeof pkg.license !== "string" || pkg.license.length === 0) {
            errors.push("staged package has no license; add LICENSE and the license field");
          }
          if (!pkg.name || !pkg.version) {
            errors.push("staged package is missing name or version");
          }
          if (errors.length > 0) {
            for (const error of errors) console.error(error);
            process.exit(1);
          }
          EOF

      - name: Upload the staged package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .pack
          include-hidden-files: true
          retention-days: 7

  tag:
    name: Tag the release commit
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .pack
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const { version } = JSON.parse(fs.readFileSync(".pack/package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Expected a stable package version");
            const tag = `v${version}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            let existing;
            try {
              existing = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              let object = existing.data.object;
              while (object.type === "tag") {
                object = (await github.rest.git.getTag({ ...repo, tag_sha: object.sha })).data.object;
              }
              if (object.type !== "commit" || object.sha !== context.sha) {
                throw new Error(`${tag} already points to a different commit; refusing to move it`);
              }
              core.info(`${tag} already points to ${context.sha}`);
            } else {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha });
              core.info(`Created ${tag} at ${context.sha}`);
            }

  publish:
    name: Stage publish to npmjs
    needs: [build, tag]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for npm trusted publishing; all other scopes none

    steps:
      - name: Download the staged package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .pack

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: npm CLI with staged publishing support
        run: |
          npm install --global npm@11.21.2 # staged publishing requires npm >= 11.15; pinned
          npm --version

      - name: Skip when the version is already published
        id: published
        working-directory: .pack
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@t3tris-labs/sdk@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@t3tris-labs/sdk@$version is already on npm, skipping."
          fi

      - name: Stage publish to npmjs
        if: steps.published.outputs.exists != 'true'
        working-directory: .pack
        # Staged versions are invisible to `npm view`, so a re-run while a
        # release awaits approval hits a duplicate-stage error: treat that
        # specific case as a no-op. Any other staging/publishing error fails.
        run: |
          if output=$(npm stage publish 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output"
          if echo "$output" | grep -qiE 'already (staged|exists)|Cannot stage previously published version'; then
            echo "::notice::Version already staged on npm and awaiting approval."
            exit 0
          fi
          exit 1
